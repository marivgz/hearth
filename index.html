<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Heart</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.heart {
    position: relative;
    width: 400px;
    height: 350px;
    animation: beat 1.5s infinite;
}

.line {
    position: absolute;
    height: 3px;
    background: #ff1744;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #ff1744;
    animation: appear 1.8s forwards;
    opacity: 0;
}

@keyframes appear {
    to {
        opacity: 1;
    }
}

@keyframes beat {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}
</style>

</head>

<body>

<div class="heart" id="heart"></div>

<script>

const heart = document.getElementById("heart");

for(let y = -120; y <= 120; y += 5){

    let x = y / 120;

    let width = 240 * Math.sqrt(
        1 - x*x
    );

    // forma de corazón
    if(Math.abs(y) < 70){
        width += 80;
    }

    let line = document.createElement("div");
    line.className = "line";

    line.style.top = (175 + y) + "px";
    line.style.width = width + "px";
    line.style.animationDelay = ((y+120)/500)+"s";

    heart.appendChild(line);
}

</script>

</body>
</html>
